<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meal Detail</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.04);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f2f2f7;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #636366;
    }

    .date-badge .icon {
      width: 16px;
      height: 16px;
      opacity: 0.6;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f2f2f7;
      color: #8e8e93;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:active {
      transform: scale(0.9);
      background: #e5e5ea;
    }

    /* Title */
    .title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 16px;
      color: #1c1c1e;
    }

    /* Image Gallery */
    .gallery {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    .gallery-item {
      flex: 0 0 auto;
      width: 55%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      scroll-snap-align: start;
      position: relative;
    }

    .gallery-item:first-child {
      width: 60%;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .gallery-item:active img {
      transform: scale(1.05);
    }

    /* Nutrition Grid */
    .nutrition-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .nutrition-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nutrition-icon {
      font-size: 22px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nutrition-text {
      font-size: 15px;
      font-weight: 500;
      color: #3a3a3c;
    }

    .nutrition-label {
      color: #8e8e93;
      font-weight: 400;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #f2f2f7;
      margin-bottom: 20px;
    }

    /* Items Section */
    .items-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1c1c1e;
    }

    .items-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .item-chip {
      background: #2c2c2e;
      color: #ffffff;
      border-radius: 24px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
      cursor: pointer;
    }

    .item-chip:active {
      transform: scale(0.95);
      background: #48484a;
    }

    /* Subtle gradient overlay on gallery edges */
    .gallery-wrapper {
      position: relative;
      margin: 0 -20px;
      padding: 0 20px;
    }

    .gallery-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 40px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.9));
      pointer-events: none;
      border-radius: 0 16px 16px 0;
    }

    /* Safe area padding for bottom */
    .safe-area-bottom {
      height: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="date-badge">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="dateTime">Feb 14, 10:03AM</span>
      </div>
      <button class="close-btn" onclick="window.close()">✕</button>
    </div>

    <!-- Title -->
    <h1 class="title">Middle Eastern Chicken Tawook Platter</h1>

    <!-- Image Gallery -->
    <div class="gallery-wrapper">
      <div class="gallery">
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600&h=600&fit=crop&q=80" alt="Chicken Tawook" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=400&h=400&fit=crop&q=80" alt="Tabbouleh" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400&h=400&fit=crop&q=80" alt="Kebab" loading="lazy">
        </div>
      </div>
    </div>

    <!-- Nutrition Info -->
    <div class="nutrition-grid">
      <div class="nutrition-item">
        <div class="nutrition-icon">🍽️</div>
        <div class="nutrition-text">
          <span class="nutrition-label">Calories: </span>1250kcal
        </div>
      </div>
      <div class="nutrition-item">
        <div class="nutrition-icon">🌿</div>
        <div class="nutrition-text">
          <span class="nutrition-label">Carbs: </span>120g
        </div>
      </div>
      <div class="nutrition-item">
        <div class="nutrition-icon">💪</div>
        <div class="nutrition-text">
          <span class="nutrition-label">Protein: </span>75g
        </div>
      </div>
      <div class="nutrition-item">
        <div class="nutrition-icon">🧈</div>
        <div class="nutrition-text">
          <span class="nutrition-label">Fat: </span>50g
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Items -->
    <h2 class="items-title">Items</h2>
    <div class="items-container">
      <div class="item-chip">Chicken Shish Tawook</div>
      <div class="item-chip">Hummus</div>
      <div class="item-chip">Baba Ganoush</div>
      <div class="item-chip">Naan Bread</div>
      <div class="item-chip">Basmati Rice</div>
      <div class="item-chip">Garnish</div>
      <div class="item-chip">Garlic Sauce</div>
    </div>

    <div class="safe-area-bottom"></div>
  </div>

  <script>
    // Format current date/time
    function updateDateTime() {
      const now = new Date();
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const month = months[now.getMonth()];
      const day = now.getDate();
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('dateTime').textContent = `${month} ${day}, ${hours}:${minutes}${ampm}`;
    }
    updateDateTime();
  </script>
</body>
</html>
