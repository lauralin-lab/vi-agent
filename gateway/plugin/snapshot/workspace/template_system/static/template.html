<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Component Template</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Component Library -->
    <script src="/components.js"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(0 0% 100%)',
                        foreground: 'hsl(222.2 84% 4.9%)',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    
    <!-- Main Container -->
    <div id="app" class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- AI AGENT: Build UI using Components library
             
             IMPORTANT: Delete the example code below and replace with your own component calls.
             
             Example usage:
             const app = document.getElementById('app');
             app.appendChild(Components.header('Welcome', 'Get started below'));
             app.appendChild(Components.text('Your message here'));
             app.appendChild(Components.option('opt1', 'First Option', 'Description here'));
             app.appendChild(Components.button('Continue', 'next_action'));
             
             Available Components:
             - Components.header(title, subtitle)
             - Components.text(content, markdown)
             - Components.code(language, code, showLineNumbers)
             - Components.table(columns, data)
             - Components.option(id, title, description, data)
             - Components.button(label, action, variant, data)
             - Components.input(id, label, type, placeholder)
             - Components.productCard(product)
             - Components.alert(message, type)
             - Components.loading(message)
             
             See /components_library.md for full API reference with examples.
        -->
        
    </div>
    
    <!-- Example JavaScript for AI Agent (DELETE THIS SECTION when generating) -->
    <script>
        // EXAMPLE: This shows how to build UI with components.js
        // AI Agent should generate similar code based on user needs
        
        const app = document.getElementById('app');
        
        // Example 1: Header
        app.appendChild(Components.header('Example Interface', 'This demonstrates the component library'));
        
        // Example 2: Alert
        app.appendChild(Components.alert('This is a sample interface. Replace with your generated content.', 'info'));
        
        // Example 3: Text with markdown
        app.appendChild(Components.text('You can use **markdown** formatting in text components.', true));
        
        // Example 4: Options
        app.appendChild(Components.option('option1', 'First Option', 'Click to select this option', {value: 1}));
        app.appendChild(Components.option('option2', 'Second Option', 'Click to select this option', {value: 2}));
        
        // Example 5: Button
        const btnContainer = document.createElement('div');
        btnContainer.className = 'flex gap-3 mt-6';
        btnContainer.appendChild(Components.button('Primary Action', 'action_primary', 'primary'));
        btnContainer.appendChild(Components.button('Cancel', 'action_cancel', 'outline'));
        app.appendChild(btnContainer);
    </script>
    
    <!-- Callback System Script -->
    <script>
        /**
         * Send a callback to the parent application
         * @param {string} type - The type of callback (action, select, input, request, close)
         * @param {string} value - The primary value or action identifier
         * @param {object} data - Additional data to send (optional)
         */
        function sendCallback(type, value, data = {}) {
            const payload = {
                type: type,
                value: value,
                data: data,
                timestamp: Date.now()
            };
            
            // iOS (WKWebView)
            if (window.webkit?.messageHandlers?.appCallback) {
                window.webkit.messageHandlers.appCallback.postMessage(payload);
                return;
            }
            
            // Android (WebView)
            if (window.AndroidBridge?.onCallback) {
                window.AndroidBridge.onCallback(JSON.stringify(payload));
                return;
            }
            
            // Electron
            if (window.electronAPI?.sendCallback) {
                window.electronAPI.sendCallback(payload);
                return;
            }
            
            // Fallback for testing in browser
            console.log('Callback:', payload);
            window.parent.postMessage(payload, '*');
        }
        
        /**
         * Send input value to app
         * Automatically called by Components.input() on change
         */
        function sendInput(fieldId, value) {
            sendCallback('input', fieldId, { value: value });
        }
        
        /**
         * Request data from app
         */
        function requestData(dataType) {
            sendCallback('request', dataType, {});
        }
        
        /**
         * Close or dismiss this view
         */
        function closeView() {
            sendCallback('close', 'user_dismissed', {});
        }
    </script>
    
</body>
</html>
