[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-livekit-agent"
version = "1.0.0"
description = "VI LiveKit Realtime Agent — Gemini Live voice assistant"
requires-python = ">=3.10, <3.14"

dependencies = [
    "livekit-agents[silero,turn-detector,images]~=1.3",
    "livekit-plugins-google~=1.3",
    "livekit-plugins-openai~=1.0",
    "livekit-plugins-deepgram~=1.0",
    "livekit-plugins-cartesia~=1.0",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
    "aiohttp",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
