# .teamspace/config.yml
# AI-Native Agile Operating System — 团队配置
#
# 这个文件定义了团队成员、任务状态模型、和工作流约定。
# 是整个 teamspace 系统的 schema 定义。

skill_version: 2.5.0

team:
  name: "VI Agent"
  repo: "flair-home-stylist/vi_agent"

# GitHub-native SOP: Issues = source of truth, board.md = generated view
github:
  source_of_truth: issues  # "issues" or "board-md"
  label_prefix:
    status: "status:"
    priority: "priority:"
    domain: "domain:"
    version: "version:"
    size: "size:"
  mc_label: "mission-contract"  # label that identifies Mission Contracts

# 可选角色 (domain-based)
roles:
  - id: lead
    label: "Tech Lead"
    description: "Overall technical direction and team coordination"
  - id: backend-engineer
    label: "Backend Engineer"
    description: "API server, database, backend services"
  - id: frontend-engineer
    label: "Frontend Engineer"
    description: "React frontend, UI/UX implementation"
  - id: realtime-engineer
    label: "Realtime Engineer"
    description: "LiveKit agent, voice pipeline, realtime services"
  - id: gateway-engineer
    label: "Gateway Engineer"
    description: "Gateway service, executor adapters, template system"
  - id: infra-engineer
    label: "Infra Engineer"
    description: "CI/CD, deployment, DevOps, testing infrastructure"
  - id: fullstack-engineer
    label: "Fullstack Engineer"
    description: "Cross-service development"
  - id: agent-engineer
    label: "Agent Engineer"
    description: "AI agent development, realtime intelligence, memory systems"

members:
  - id: casey
    name: "Casey"
    role: lead
    github: caseyz-vv
  - id: liyasong
    name: "Liya Song"
    role: infra-engineer
    github: lysfighting
  - id: yuang-yang
    name: "yuang-yang"
    role: backend-engineer
    github: yuang-yang
  - id: szj
    name: "szj"
    role: realtime-engineer
    github: initialneil
  - id: xxLe
    name: "xxLe"
    role: frontend-engineer
    github: xxLe
  - id: yijia
    name: "Yijia Zhou"
    role: agent-engineer
    github: FelisaChow

# Kanban 状态定义（顺序即流转方向）
# Backlog → Queued → WIP → Blocked / In Review → Done → Archive
statuses:
  - id: backlog
    label: "💡 Backlog"
    description: "想法池，未排期"
  - id: queued
    label: "📋 Queued"
    description: "已排期，准备开始"
  - id: wip
    label: "🟡 In Progress"
    description: "正在进行中"
  - id: blocked
    label: "🔴 Blocked"
    description: "被阻塞，需要解除"
  - id: review
    label: "🔵 In Review"
    description: "等待 review / 测试"
  - id: done
    label: "✅ Done"
    description: "完成"

# 任务优先级
priorities:
  - P0  # 🔥 紧急 — 立刻处理
  - P1  # ⚡ 高优 — 当前 sprint 必须完成
  - P2  # 📌 正常 — 排入计划
  - P3  # 💤 低优 — 有空再做

# 标签系统
tags:
  # 按服务/模块
  services: [api-server, frontend, realtime, gateway, global, claude-skills]
  # 按类型
  types: [feature, bugfix, refactor, infra, enhance, docs, test]

# 任务 ID 约定
task_id:
  prefix: "T"
  format: "T-{三位数字}"  # T-001, T-042, etc.
  next_id: 64  # 下一个可用 ID

# 工作量估算
estimation:
  S: "1-2 小时"
  M: "半天到 1 天"
  L: "2-3 天"
  XL: "需要拆分成多个任务"

# Worktree 约定
worktree:
  # worktree 创建在项目的兄弟目录
  path_pattern: "../vi-wt-{task-slug}"
  # 分支命名遵循 CONTRIBUTING.md
  branch_pattern: "{type}/{task-id}-{slug}"
  # 示例: ../vi-wt-vad-fix → bugfix/T-044-vad-signal
  # 一键创建: scripts/setup-worktree.sh {task-slug} [port-offset]
  setup_script: "scripts/setup-worktree.sh"

# 端口隔离 — 多人并行开发时避免端口冲突
# 每个开发者的 worktree 通过 port offset 获得独立端口
port_isolation:
  base_ports:
    api: 8000
    frontend: 5173
    gateway: 18789
  offset_step: 100  # 每个开发者 +100
  # 示例: Dev A → API:8100, FE:5273, GW:18889

# 版本管理
versions:
  current: "V0.1"
  spec_path: ".claude/drive/v0.1-definition/v0.1-spec.md"
  # 当版本内所有任务 Done → 进入 QA 环节
  # QA 通过 → git tag v0.1.0
  lifecycle: [dev, qa, released]

# Drive Mode 集成
drive:
  source: github-issues  # "github-issues" or "board-md"
  # Drive 启动时读取 GitHub Issues 了解上下文
  read_board_on_start: true
  # Mission 完成时通过 gh 更新 Issue 状态
  update_board_on_complete: true
  # state.md 中记录关联的 GitHub Issue number
  track_task_id: true

# 归档策略
archive:
  auto_archive_after_days: 30
  archive_by: month  # 按月归档到 archive/YYYY-MM.md

# 更新约定
conventions:
  update_frequency: "每人每天至少更新一次自己的任务状态"
  board_ownership: "每人只修改自己 Owner 的行，减少 merge conflict"
  drive_marks: "通过 /drive 执行的任务在 Drive? 列标记 ✅"
  branch_pattern: "{type}/{task-id}-{slug}"
  base_branch: main
  commit_format: "type(scope): description | Mission: #{issue}"

# Appended by /team init — monorepo project detection
project:
  type: monorepo
  services:
    - name: api-server
      language: python
      test_command: "cd api-server && python -m pytest tests/ -v --tb=short"
      lint_command: "cd api-server && ruff check ."
    - name: frontend
      language: typescript
      test_command: "cd frontend && npm test"
      lint_command: "cd frontend && npx eslint src/"
      build_command: "cd frontend && npm run build"
    - name: realtime
      language: python
      test_command: "cd realtime && uv run python -m pytest tests/ -v --tb=short"
    - name: gateway
      language: typescript
      lint_command: "cd gateway/plugin && npm run lint"

# Quality gates
quality:
  hooks: false
  ci: true
  review_required: false
  branch_protection: false
