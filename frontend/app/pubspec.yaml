name: collov_camera
description: "camera demo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.4'

dependencies:
  flutter:
    sdk: flutter

  ##################################################################################################
  dio: ^5.8.0+1                                               # Http 封装库
  dio_cache_interceptor: ^4.0.3                               # Dio Http 缓存拦截器
  http_cache_file_store: ^2.0.1                               # Dio Http 磁盘缓存实现
  xml: ^6.6.1                                                 # XML 解析库
  ##################################################################################################
  flutter_riverpod: ^2.6.1                                    # 状态管理组件
  riverpod_annotation: ^2.6.1                                 # 状态管理组件注解
  ##################################################################################################
  android_intent_plus: ^5.3.0                                 # Android Intent 跳转库；官方（社区）
  connectivity_plus: ^7.0.0                                   # 监听网络、蓝牙设备变化；官方（社区）
  device_info_plus: ^12.3.0                                   # 获取设备信息；官方（社区）
  package_info_plus: ^8.3.0                                   # 获取应用信息，诸如版本、名称；官方（社区）
  webview_flutter: ^4.10.0                                    # WebView 跨平台兼容实现；官方（社区）
  flutter_html: ^3.0.0                                        # html 文本显示 官方（社区）
  ##################################################################################################
  visibility_detector: ^0.4.0+2                               # 监听视图是否在屏幕中展示；官方（社区）
  shared_preferences: ^2.5.3                                  # 用于配置的读取和保存；官方（社区）
  ##################################################################################################
  firebase_core: 3.13.0                                       # Firebase 核心组件
  firebase_analytics: 11.4.5                                  # Firebase 分析组件
  firebase_messaging: 15.2.5                                  # Firebase 消息组件
  firebase_crashlytics: 4.3.5                                 # Firebase 质量组件
  firebase_auth: 5.5.2                                        # Firebase 登录组件
  ##################################################################################################
  cached_network_image: ^3.4.1                                # 图片缓存框架技术
  flutter_cache_manager: ^3.4.1                               # 缓存管理器
  go_router: ^14.8.1                                          # 路由处理组件
  talker: ^4.8.4                                              # 日志与控制台
  talker_flutter: ^4.8.4                                      # 日志与控制台扩展
  talker_dio_logger: ^4.8.4                                   # 输出 DIO 日志
  talker_riverpod_logger: ^4.8.4                              # 输出 riverpod 日志
  permission_handler: ^12.0.1                                 # 权限请求、处理组件
  photo_manager: ^3.7.1                                       # 照片管理
  photo_manager_image_provider: ^2.2.0                        # 图片管理器提供者
  image_picker: ^1.1.2                                        # 图片选择器
  flutter_secure_storage: ^10.0.0                             # KeyChain和KeyStore数据持久化
  ##################################################################################################
  gap: ^3.0.1                                                 # 用于流式组件替代 SizeBox() 提供间隔
  lottie: ^3.3.1                                              # Lottie JSON 动画组件
  camera: ^0.11.3                                             # 相机组件
  flutter_sound: ^9.11.0                                      # 录音播放
  audio_session: ^0.1.21                                      # 配合flutter_sound组件
  shimmer: ^3.0.0                                             # 图片加载占位微光效果
  fluttertoast: ^8.2.12                                       # 跨平台 Toast 提示实现
  flutter_keyboard_visibility: ^6.0.0                         # 虚拟键键盘隐藏、显示组件
  flutter_staggered_grid_view: ^0.7.0                         # 复杂列表瀑布流实现
  ##################################################################################################
  path: ^1.9.0                                                # 用于支持跨平台和路径处理；官方
  path_provider: ^2.1.4                                       # 跨平台基础路径提供；官方
  json_annotation: ^4.9.0                                     # 用于支持 Json 序列化代码生成；官方
  livekit_client: ^2.6.0                                      # liveKit client
  google_sign_in: ^6.3.0                                      # google登陆
  flutter_markdown_plus: ^1.0.7                               # markdown
  mime: ^2.0.0                                                # 根据文件路径或内容推断 MIME Type;官方生态
  crypto: ^3.0.3                                              # 加密
  uuid: ^4.3.3                                                # uuid
  url_launcher: ^6.3.2                                        # 用于 URL 跳转；官方（社区）
  ##################################################################################################
  advertising_id: ^2.7.1                                      # 用于获取广告 ID
  adjust_sdk: ^5.1.1                                          # Adjust 打点
  flutter_image_compress: ^2.4.0                              # 图片压缩
  ##################################################################################################
  rive_rolls_collection:
    git:
      url: git@github.com:riverolls/flutter_kit.git
      path: packages/collection
      ref: 0.13.1
  ##################################################################################################
  device_id:
    git:
      url: git@github.com:riverolls/flutter_packages.git
      path: packages/device_id
      ref: 626ab6263f084dc7948e87f335ab2ca453037969
  ##################################################################################################
  sfml:
    git:
      url: git@github.com:riverolls/sfml.git
      path: flutter
      ref: 1.9.1
  ##################################################################################################
  rive_rolls_rich_text:
    git:
      url: git@github.com:riverolls/flutter_kit.git
      path: packages/rich_text
      ref: 0.13.1
  ##################################################################################################
  rive_rolls_video_trimmer:
    git:
      url: git@github.com:riverolls/flutter_kit.git
      path: packages/video_trimmer
      ref: 0.13.1
  sqflite: ^2.4.2
  easy_refresh: ^3.4.0
  shake: ^3.0.0
  video_player: ^2.9.3                                        # 视频播放器（登录页背景视频）
  ##################################################################################################

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14                                       # 预构建组件
  go_router_builder: ^2.8.2                                   # go_router 自动生成
  json_serializable: ^6.9.4                                   # Json 序列化代码生成工具

  ##################################################################################################

flutter:
  uses-material-design: true
  generate: false

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.otf
          weight: 400
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.otf
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYSEMIBOLDITALIC.otf
          weight: 600
        - asset: assets/fonts/SFPRODISPLAYBOLD.otf
          weight: 700

  assets:
    - assets/images/
    - assets/fonts/
    - assets/lottie/
    - assets/media/

