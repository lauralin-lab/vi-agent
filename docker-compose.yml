services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vi_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vi_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vi} -d ${POSTGRES_DB:-vi_db}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_pass}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_dev_pass} --no-auth-warning ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  # --- API Server ---
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    restart: unless-stopped
    # No host port needed — nginx proxies /api/ internally via Docker network
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vi}:${POSTGRES_PASSWORD:-vi_secret_change_me}@postgres:5432/${POSTGRES_DB:-vi_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-DO-NOT-USE-IN-PRODUCTION}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      GCS_BUCKET: ${GCS_BUCKET:-vi-uploads}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-vi-internal-dev-token}
      SHARED_SKILLS_DIR: /data/shared/skills
      USER_DATA_DIR: /data/users
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  # --- vi-realtime (VI LiveKit Agent V4) ---
  vi-realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_REALTIME_MODEL: ${GEMINI_REALTIME_MODEL:-gemini-2.5-flash-native-audio-preview-12-2025}
      GEMINI_REALTIME_VOICE: ${GEMINI_REALTIME_VOICE:-Aoede}
      GEMINI_REALTIME_TEMPERATURE: ${GEMINI_REALTIME_TEMPERATURE:-0.7}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      API_BASE_URL: http://api-server:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-vi-internal-dev-token}
      VI_EXECUTOR_HINT: ${VI_EXECUTOR_HINT:-}
    depends_on:
      api-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081')\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  # --- NanoClaw (V4 Master Orchestrator — replaces gateway) ---
  nanoclaw:
    build:
      context: ./nanoclaw
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      API_SERVER_URL: http://api-server:8000
      # USER_ID no longer needed — NanoClaw discovers active users dynamically
      USER_DATA_DIR: /workspace
      HEALTH_PORT: "3100"
    volumes:
      - ./data/dev/user:/workspace
      - ./nanoclaw/data/shared/skills:/skills:ro
      - ./packages:/packages:ro
    depends_on:
      redis:
        condition: service_healthy
      api-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3100/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_LIVEKIT_URL: ${LIVEKIT_URL}
        # VITE_DEFAULT_USER_ID removed — userId comes from Firebase auth
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

networks:
  vi-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
