# VI Agent — Staging Environment
# Runs all services + Postgres + Redis locally on VM
# Usage: docker compose -f docker-compose.staging.yml up -d

name: vi-agent-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vi_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vi_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vi_agent -d vi_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vi-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - vi-network

  api-server:
    image: collov/vi-agent-api-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://vi_agent:${POSTGRES_PASSWORD}@postgres:5432/vi_agent
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GCS_BUCKET=${GCS_BUCKET:-vi-uploads}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_PROJECTS=${FIREBASE_PROJECTS:-}
      - USER_DATA_DIR=/data/users
    volumes:
      - api_user_data:/data/users
      - ${FIREBASE_SA_DIR:-./firebase}:/firebase:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  frontend:
    image: collov/vi-agent-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      api-server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  nanoclaw:
    image: collov/vi-agent-nanoclaw:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - API_SERVER_URL=http://api-server:8000
      # USER_ID no longer needed — NanoClaw discovers active users dynamically
      - USER_DATA_DIR=/workspace
      - HEALTH_PORT=3100
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - nanoclaw_workspace:/workspace
    depends_on:
      redis:
        condition: service_healthy
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  admin-server:
    image: collov/vi-agent-admin-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://vi_agent:${POSTGRES_PASSWORD}@postgres:5432/vi_agent
      - CORS_ORIGINS=${ADMIN_CORS_ORIGINS:-http://localhost:3001}
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_PROJECTS=${FIREBASE_PROJECTS:-}
    volumes:
      - ${FIREBASE_SA_DIR:-./firebase}:/firebase:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  admin-web:
    image: collov/vi-agent-admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      admin-server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

  vi-realtime:
    image: collov/vi-agent-realtime:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - API_BASE_URL=http://api-server:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vi-network

volumes:
  postgres_data:
  redis_data:
  nanoclaw_workspace:
  api_user_data:

networks:
  vi-network:
    driver: bridge
