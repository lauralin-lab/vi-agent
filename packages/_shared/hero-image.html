<!--
  hero-image template
  Slots: image_url, title, subtitle, description, actions[]
  actions[]: { label, action, icon }
-->
<style>
  .hi-container { position: relative; border-radius: 16px; overflow: hidden; }
  .hi-img-wrap { position: relative; }
  .hi-img {
    width: 100%; max-height: 300px; object-fit: cover;
    display: block; border: none; border-radius: 0;
  }
  .hi-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 24px 18px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
  }
  .hi-title {
    color: #fff; font-size: var(--text-xl); font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4); line-height: 1.3;
  }
  .hi-subtitle {
    color: rgba(255,255,255,0.65); font-size: var(--text-sm);
    margin-top: 3px;
  }
  .hi-desc {
    padding: 14px 4px; color: rgba(0,0,0,0.6);
    font-size: var(--text-sm); line-height: 1.65;
  }
  .hi-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 0 4px 6px;
  }
  .hi-action {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 100px;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
    font-size: var(--text-sm); font-weight: 500;
    color: rgba(0,0,0,0.7); cursor: pointer; transition: all 0.2s;
  }
  .hi-action:hover { background: #fff; }
  .hi-action:active { transform: scale(0.97); }
</style>

<div class="hi-container">
  <div class="hi-img-wrap">
    <img class="hi-img" src="{{image_url}}" alt="{{title}}"/>
    <div class="hi-overlay">
      <div class="hi-title">{{title}}</div>
      {{#subtitle}}<div class="hi-subtitle">{{subtitle}}</div>{{/subtitle}}
    </div>
  </div>
  {{#description}}<div class="hi-desc">{{description}}</div>{{/description}}
  <div class="hi-actions">
    {{#actions}}
    <button class="hi-action" data-action="{{action}}">
      {{#icon}}<span>{{icon}}</span>{{/icon}}
      {{label}}
    </button>
    {{/actions}}
  </div>
</div>
