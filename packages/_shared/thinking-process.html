<!--
  thinking-process template
  Slots: title, steps[], conclusion
  Each step: { label, content, status: active|done|skipped }
-->
<style>
  .tp-container { padding: 4px 0; }
  .tp-title { font-size: var(--text-lg); font-weight: 600; color: #000; margin-bottom: 12px; }
  .tp-steps { display: flex; flex-direction: column; gap: 0; }
  .tp-step {
    display: flex; gap: 10px; padding: 8px 0;
    border-left: 2px solid rgba(0,0,0,0.06);
    margin-left: 8px; padding-left: 14px;
  }
  .tp-step.active { border-left-color: #3b82f6; }
  .tp-step-icon {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0; margin-top: 1px;
  }
  .tp-step-icon.done { background: rgba(34,197,94,0.12); color: #22c55e; }
  .tp-step-icon.skipped { background: rgba(0,0,0,0.04); color: rgba(0,0,0,0.3); }
  .tp-step-icon.active { background: rgba(59,130,246,0.12); color: #3b82f6; }
  .tp-step-body { flex: 1; min-width: 0; }
  .tp-step-label { font-weight: 500; color: #000; font-size: var(--text-sm); line-height: 1.4; }
  .tp-step-content { color: rgba(0,0,0,0.5); font-size: var(--text-sm); margin-top: 3px; line-height: 1.5; }
  .tp-conclusion {
    margin-top: 14px; padding: 12px 14px;
    background: rgba(0,0,0,0.02); border-radius: 12px;
    font-weight: 500; color: #000; font-size: var(--text-base);
    line-height: 1.5;
  }
  .tp-spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(59,130,246,0.2); border-top-color: #3b82f6;
    border-radius: 50%; animation: tp-spin 0.8s linear infinite;
  }
  @keyframes tp-spin { to { transform: rotate(360deg); } }
</style>

<div class="tp-container">
  <div class="tp-title">{{title}}</div>
  <div class="tp-steps">
    {{#steps}}
    <div class="tp-step {{status}}">
      <span class="tp-step-icon {{status}}">
        {{#if_done}}&#10003;{{/if_done}}
        {{#if_skipped}}&mdash;{{/if_skipped}}
        {{#if_active}}<span class="tp-spinner"></span>{{/if_active}}
      </span>
      <div class="tp-step-body">
        <div class="tp-step-label">{{label}}</div>
        <div class="tp-step-content">{{content}}</div>
      </div>
    </div>
    {{/steps}}
  </div>
  {{#conclusion}}
  <div class="tp-conclusion">{{conclusion}}</div>
  {{/conclusion}}
</div>
