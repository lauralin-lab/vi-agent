<!--
  calendar-event template
  Slots: title, start_time, end_time, location, description, attendees[], status
-->
<style>
  .ce-container { padding: 4px 0; }
  .ce-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ce-icon { font-size: 22px; }
  .ce-title { font-size: var(--text-lg); font-weight: 600; color: #000; }
  .ce-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; color: rgba(0,0,0,0.6); font-size: var(--text-sm);
  }
  .ce-row svg {
    width: 15px; height: 15px; flex-shrink: 0;
    color: rgba(0,0,0,0.3); stroke-width: 2;
  }
  .ce-desc {
    color: rgba(0,0,0,0.5); font-size: var(--text-sm);
    margin: 10px 0; line-height: 1.6;
  }
  .ce-attendees { display: flex; margin: 12px 0; }
  .ce-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,0.06); display: flex;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.5);
    border: 2px solid #fff; margin-left: -6px;
  }
  .ce-avatar:first-child { margin-left: 0; }
  .ce-status-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .ce-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 100px;
    font-size: var(--text-xs); font-weight: 500;
  }
  .ce-status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .ce-status-pending { background: rgba(234,179,8,0.1); color: #ca8a04; }
  .ce-status-pending .ce-status-dot { background: #eab308; }
  .ce-status-added { background: rgba(34,197,94,0.1); color: #16a34a; }
  .ce-status-added .ce-status-dot { background: #22c55e; }
  .ce-status-declined { background: rgba(239,68,68,0.1); color: #dc2626; }
  .ce-status-declined .ce-status-dot { background: #ef4444; }
  .ce-actions { margin-top: 14px; }
</style>

<div class="ce-container">
  <div class="ce-header">
    <span class="ce-icon">📅</span>
    <span class="ce-title">{{title}}</span>
  </div>

  <div class="ce-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>{{start_time}}{{#end_time}} &mdash; {{end_time}}{{/end_time}}</span>
  </div>

  <div class="ce-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <span>{{location}}</span>
  </div>

  <div class="ce-desc">{{description}}</div>

  <div class="ce-attendees">
    {{#attendees}}
    <div class="ce-avatar" title="{{.}}">{{initials}}</div>
    {{/attendees}}
  </div>

  <div class="ce-status-row">
    <span class="ce-status ce-status-{{status}}">
      <span class="ce-status-dot"></span>
      {{status_label}}
    </span>
  </div>

  <div class="ce-actions">
    <button class="vi-btn vi-btn-primary" data-action="add_to_calendar">Add to Calendar</button>
  </div>
</div>
