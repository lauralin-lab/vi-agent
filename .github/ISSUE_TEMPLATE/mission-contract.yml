name: "Mission Contract"
description: "Create a new Mission Contract (atomic task for team execution)"
title: "[T-XXX] "
labels: ["mission-contract", "status:queued"]
body:
  - type: markdown
    attributes:
      value: |
        ## Mission Contract
        Fill in the sections below to define a clear, atomic task.

  - type: input
    id: priority
    attributes:
      label: Priority
      description: "P0 (urgent), P1 (high), P2 (normal), P3 (low)"
      placeholder: "P1"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Estimated Size
      options:
        - S (1-2 hours)
        - M (half-day to 1 day)
        - L (2-3 days)
        - XL (needs splitting)
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Primary Domain
      options:
        - api-server
        - frontend
        - realtime
        - gateway
        - global
        - infra
      description: "Which service/area does this primarily affect?"
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: "What must be true for this MC to be considered DONE? Use checkboxes."
      placeholder: |
        - [ ] Criterion 1 — concrete, verifiable
        - [ ] Criterion 2 — ...
    validations:
      required: true

  - type: textarea
    id: sub-tasks
    attributes:
      label: Sub-tasks
      description: "Break down the work into specific steps."
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Background, related files, technical details, references."
      placeholder: "Relevant files: src/..., Related to #..."

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: "Any limitations, dependencies, or things NOT to do."
      placeholder: "Must not break existing API endpoints..."

  - type: textarea
    id: verification
    attributes:
      label: Verification Method
      description: "How to verify this MC is complete (test commands, manual checks, etc.)"
      placeholder: |
        ```bash
        pytest tests/ -v
        ```
