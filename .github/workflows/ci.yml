name: CI

on:
  pull_request:
    branches: [pre-launch, main]
  push:
    branches: [pre-launch, main]

jobs:
  # API Server checks
  api-server:
    name: API Server (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vi_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite pytest-timeout

      - name: Lint with ruff
        working-directory: api-server
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        working-directory: api-server
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vi_db_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          JWT_ALGORITHM: HS256
          LIVEKIT_API_KEY: test-livekit-key
          LIVEKIT_API_SECRET: test-livekit-secret-must-be-256-bits!!
        run: |
          timeout 60 python -m pytest tests/test_smoke.py -v --tb=long --timeout=30 -x 2>&1; smoke_exit=$?
          echo "--- smoke test exit code: $smoke_exit ---"
          # exit 124 = timeout killed the process (pytest hangs after all tests pass)
          # Accept 0 (clean exit) or 124 (timeout after success) as passing
          if [ "$smoke_exit" -ne 0 ] && [ "$smoke_exit" -ne 124 ]; then
            echo "::error::Smoke tests failed (exit $smoke_exit)"
            exit $smoke_exit
          fi
          timeout 60 python -m pytest tests/ -v --tb=short --timeout=30 -x 2>&1; test_exit=$?
          if [ "$test_exit" -ne 0 ] && [ "$test_exit" -ne 124 ]; then
            echo "::error::Tests failed (exit $test_exit)"
            exit $test_exit
          fi
          echo "All API Server tests passed"

  # NanoClaw checks (V4 — replaces gateway)
  nanoclaw:
    name: NanoClaw (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: nanoclaw
        run: npm ci

      - name: Type check
        working-directory: nanoclaw
        run: npx tsc --noEmit

  # Frontend checks
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint src/

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_LIVEKIT_URL: "wss://test.livekit.cloud"
        run: npm run build

  # Realtime checks
  realtime:
    name: Realtime (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: realtime
        run: uv sync

      - name: Run tests
        working-directory: realtime
        run: |
          if [ -n "$(find tests/ -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            uv run python -m pytest tests/ -v --tb=short
          else
            echo "No test files found — skipping"
          fi

  # Branch protection summary
  ci-summary:
    name: CI Summary
    needs: [api-server, nanoclaw, frontend, realtime]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.api-server.result }}" = "failure" ] || \
             [ "${{ needs.nanoclaw.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.realtime.result }}" = "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "All CI checks passed"
