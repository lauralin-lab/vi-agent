name: Deploy

on:
  # Manual deploy only — staging deploys rc/* branches, prod deploys tags
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - staging
          - prod
        default: staging
      ref:
        description: "Git ref to deploy (rc/* branch for staging, V*.*.* tag for prod)"
        required: true

env:
  DOCKER_ORG: collov
  SERVICES: api-server frontend nanoclaw realtime admin-server admin-web

jobs:
  # ---------------------------------------------------------------------------
  # Determine environment and ref
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      ref: ${{ steps.env.outputs.ref }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - name: Determine deploy parameters
        id: env
        run: |
          ENV="${{ inputs.environment }}"
          REF="${{ inputs.ref }}"

          # Image tag: use ref directly if it's a named ref (tag/branch),
          # or shorten to 7 chars if it looks like a SHA
          if echo "$REF" | grep -qE '^[0-9a-f]{40}$'; then
            TAG_SUFFIX=$(echo "$REF" | head -c 7)
          else
            # Sanitize branch name for Docker tag (rc/V0.1.0 → rc-V0.1.0)
            TAG_SUFFIX=$(echo "$REF" | sed 's|/|-|g')
          fi
          IMAGE_TAG="${ENV}-${TAG_SUFFIX}"

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "### Deploy Parameters" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build and push Docker images
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-server, frontend, nanoclaw, realtime, admin-server, admin-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/vi-agent-${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.environment == 'prod' && format('{0}/vi-agent-{1}:latest', env.DOCKER_ORG, matrix.service) || '' }}
          build-args: |
            ${{ matrix.service == 'frontend' && 'VITE_API_URL=' || '' }}
            ${{ matrix.service == 'frontend' && 'VITE_LIVEKIT_URL=' || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_API_KEY={0}', secrets.VITE_FIREBASE_API_KEY) || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_AUTH_DOMAIN={0}', secrets.VITE_FIREBASE_AUTH_DOMAIN) || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_PROJECT_ID={0}', secrets.VITE_FIREBASE_PROJECT_ID) || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_STORAGE_BUCKET={0}', secrets.VITE_FIREBASE_STORAGE_BUCKET) || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_MESSAGING_SENDER_ID={0}', secrets.VITE_FIREBASE_MESSAGING_SENDER_ID) || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_APP_ID={0}', secrets.VITE_FIREBASE_APP_ID) || '' }}
            ${{ (matrix.service == 'frontend' || matrix.service == 'admin-web') && format('VITE_FIREBASE_PACKAGE_NAME={0}', secrets.VITE_FIREBASE_PACKAGE_NAME) || '' }}
            ${{ matrix.service == 'admin-web' && 'VITE_ADMIN_API_URL=' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Deploy to target environment
  # ---------------------------------------------------------------------------
  deploy:
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: >-
            deploy/pull-env.sh,
            deploy/docker-compose.staging.yml,
            deploy/docker-compose.prod.yml
          target: /opt/vi-agent/
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            APP_DIR="/opt/vi-agent"
            ENV="${{ needs.prepare.outputs.environment }}"
            cd "$APP_DIR"

            echo "=== Deploying vi-agent (${ENV}) ==="
            echo "Image tag: ${{ needs.prepare.outputs.image_tag }}"

            # Authenticate Docker Hub for private image pulls
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull secrets from Secret Manager → generate .env
            export ENV="${ENV}"
            export IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
            bash "${APP_DIR}/pull-env.sh"

            # Ensure Firebase SA file is readable by container processes
            if [ -f "${APP_DIR}/firebase/sa.json" ]; then
              chmod 644 "${APP_DIR}/firebase/sa.json"
              echo "Firebase SA file ready."
            else
              echo "WARNING: No Firebase SA file at ${APP_DIR}/firebase/sa.json"
            fi

            # Select compose file
            COMPOSE_FILE="docker-compose.${ENV}.yml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: Compose file not found: $COMPOSE_FILE"
              exit 1
            fi

            # Pull and start
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d

            # Wait for API health
            echo "Waiting for API server health..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "API server is healthy."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: API server did not become healthy within 60s"
                docker compose -f "$COMPOSE_FILE" ps
                docker compose -f "$COMPOSE_FILE" logs --tail=50 api-server
                exit 1
              fi
              sleep 2
            done

            echo ""
            echo "=== Deployment Complete ==="
            docker compose -f "$COMPOSE_FILE" ps

      - name: Post deploy summary
        if: always()
        run: |
          echo "### Deployment Result" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ needs.prepare.outputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ needs.prepare.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`${{ job.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
