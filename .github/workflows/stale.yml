name: Stale Issue Patrol

on:
  schedule:
    - cron: '0 2 * * 1,4'  # Monday + Thursday 10:00 CST (02:00 UTC)
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  stale-check:
    runs-on: ubuntu-latest
    steps:
      - name: Patrol stale issues
        uses: actions/github-script@v7
        with:
          script: |
            const MISSION_LABEL = 'mission';
            const WIP_LABEL = 'status:wip';
            const QUEUED_LABEL = 'status:queued';
            const STALE_LABEL = 'status:stale';
            const NOW = Date.now();
            const DAY = 86400000;

            // Thresholds — AI-assisted iteration: tasks typically done in 1-3 days
            const WIP_STALE_DAYS = 7;       // wip with no human activity for 1 week
            const QUEUED_STALE_DAYS = 14;   // queued with no one claiming for 2 weeks

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: MISSION_LABEL,
              per_page: 100
            });

            let staled = 0, skipped = 0;

            for (const issue of issues) {
              // Skip pull requests (GitHub API returns PRs as issues)
              if (issue.pull_request) { skipped++; continue; }

              const labels = issue.labels.map(l => l.name);

              // Already stale — don't re-process
              if (labels.includes(STALE_LABEL)) { skipped++; continue; }

              const isWip = labels.includes(WIP_LABEL);
              const isQueued = labels.includes(QUEUED_LABEL);
              if (!isWip && !isQueued) { skipped++; continue; }

              // Compute last human activity (ignore bot comments that would
              // otherwise reset updated_at and create an infinite loop)
              let lastHumanActivity = new Date(issue.updated_at).getTime();
              try {
                const comments = await github.rest.issues.listComments({
                  ...context.repo,
                  issue_number: issue.number,
                  per_page: 10
                });
                // Find the most recent update: either a human comment,
                // or issue creation if no human comments exist
                const humanComments = comments.data.filter(c =>
                  c.user.type !== 'Bot' && !c.body.includes('Stale alert')
                );
                if (humanComments.length > 0) {
                  lastHumanActivity = new Date(
                    humanComments[humanComments.length - 1].created_at
                  ).getTime();
                } else {
                  // No human comments — use issue creation date
                  lastHumanActivity = new Date(issue.created_at).getTime();
                }
              } catch (e) {
                // Fallback to updated_at if comment fetch fails
                console.log(`Warning: could not fetch comments for #${issue.number}: ${e.message}`);
              }

              const ageDays = Math.floor((NOW - lastHumanActivity) / DAY);
              const assignee = issue.assignees?.[0]?.login || 'unassigned';
              const threshold = isWip ? WIP_STALE_DAYS : QUEUED_STALE_DAYS;

              if (ageDays < threshold) { skipped++; continue; }

              // Mark stale
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: [STALE_LABEL]
              });

              const statusType = isWip ? 'status:wip' : 'status:queued';
              const advice = isWip
                ? [
                    `@${assignee} please update:`,
                    '- Still working → comment with progress, remove `status:stale`',
                    '- Blocked → add `status:blocked` label and describe the blocker',
                    '- Abandoned → unassign yourself so others can claim',
                  ]
                : [
                    'Consider:',
                    '- Assigning to someone if still relevant',
                    '- Closing if no longer needed',
                    '- Bumping priority if it was overlooked',
                  ];

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: [
                  `⚠️ **Stale alert** — this issue has been \`${statusType}\` for ${ageDays} days with no human activity.`,
                  '',
                  ...advice,
                  '',
                  '*Remove `status:stale` label to dismiss. This check ignores its own comments when computing activity age.*'
                ].join('\n')
              });

              staled++;
            }

            console.log(`Stale patrol: ${issues.length} issues scanned — ${staled} marked stale, ${skipped} skipped`);
