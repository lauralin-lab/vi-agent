name: Infrastructure

on:
  pull_request:
    paths: ['infra/**']
  push:
    branches: [pre-launch]
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod, shared]
        default: dev
      action:
        description: 'Terraform action'
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ (inputs.environment == 'shared') && 'infra/shared' || format('infra/environments/{0}', inputs.environment || 'dev') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP credentials
        id: creds
        run: |
          if [ -z "${{ secrets.WIF_PROVIDER }}" ] || [ -z "${{ secrets.WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP credentials not configured. Set WIF_PROVIDER and WIF_SERVICE_ACCOUNT secrets to enable Terraform."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.skip != 'true'

      - name: Authenticate to GCP
        id: auth
        if: steps.creds.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        if: steps.creds.outputs.skip != 'true'
        run: terraform init

      - name: Terraform Plan
        id: plan
        if: steps.creds.outputs.skip != 'true'
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment PR with plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.creds.outputs.skip != 'true'
        with:
          script: |
            const output = `#### Terraform Plan - \`${{ inputs.environment || 'dev' }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: >
          steps.creds.outputs.skip != 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/pre-launch') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
        run: terraform apply -auto-approve tfplan
